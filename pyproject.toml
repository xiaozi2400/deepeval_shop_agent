[project]
name = "ecommerce-customer-service"
version = "0.1.0"
description = "E-commerce Customer Service Agent with LangChain ReAct and DeepEval"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# 运行时依赖：src/ 直接 import 的每一个第三方包。
# 判据是"代码里 import 了什么"，而不是"装了什么"，
# 免得上游改版时因为隐式传递依赖而炸掉。
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.28.0",
]

# 开发依赖：跑测试与 lint 才需要，不进运行时。
# deepeval 只被 tests/integration/test_deepeval.py 用到，
# 放在这里可以让只跑应用的人不必装整套评测框架。
[project.optional-dependencies]
dev = [
    "deepeval>=4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 显式钉住规则集，不依赖 ruff 的默认值。
# ruff 0.16 的默认集有 830 条规则，工具一升级 CI 就可能突然变红；
# 显式列出后，规则集只随本文件变化。
#
# E4/E7/E9 而非整个 E：E501 按显示宽度算，中文字符占两格，
# 100 的限制在中文 codebase 里几乎无法遵守，而拆中文句子只会降低可读性。
# I 排序导入，UP 现代化语法，B bugbear，C4 推导式，SIM 简化，RET 返回值。
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RET"]

[tool.ruff.lint.per-file-ignores]
# 测试要在 import 项目模块之前先 importorskip(deepeval)，
# 没装 deepeval 时整个模块跳过而不是收集失败。这要求 import 不在最顶上。
"tests/integration/test_deepeval.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "llm: 需要真实 LLM 的测试，缺少 OPENAI_API_KEY 时跳过",
]

[tool.deepeval]
metrics = [
    "answer_relevancy",
    "faithfulness",
    "contextual_precision",
    "contextual_recall",
    "hallucination",
    "toxicity"
]
