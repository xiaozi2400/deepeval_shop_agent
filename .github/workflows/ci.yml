name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支的新提交取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # secrets 上下文在 job 级的 if 里不可用，只有 step 级能用。
  # 所以用一个探测 job 把"密钥是否配置"转成 output，后面两个 job 靠它决定跑不跑。
  detect-secrets:
    name: 检测密钥
    runs-on: ubuntu-latest
    outputs:
      has_llm_key: ${{ steps.check.outputs.has_llm_key }}
    steps:
      - id: check
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ secrets.MODEL_NAME }}
        run: |
          # 未配置的 secret 会被展开成空字符串，所以判断非空而不是判断存在
          if [ -n "$API_KEY" ] && [ -n "$MODEL" ]; then
            echo "has_llm_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_llm_key=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        # --locked 表示不重新解析也不改锁文件，但要求 uv.lock 与 pyproject.toml 一致，
        # 两者不一致直接失败，避免 CI 装出跟本地不一样的依赖
        run: uv sync --all-extras --locked

      - name: 单元测试
        # 单测不碰 LLM，不需要任何密钥
        run: uv run pytest tests/unit -v

      - name: lint
        run: uv run ruff check .

  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    # 需要真实 LLM。没配密钥时这一档会跳过，
    # PR 上想跑可以给仓库加 OPENAI_API_KEY secret。
    needs: detect-secrets
    if: needs.detect-secrets.outputs.has_llm_key == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-extras --locked

      - name: 集成测试
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          DEEPEVAL_MODEL: ${{ secrets.DEEPEVAL_MODEL }}
        run: uv run pytest tests/integration -v

  intent-check:
    name: 五类意图端到端
    runs-on: ubuntu-latest
    needs: detect-secrets
    if: needs.detect-secrets.outputs.has_llm_key == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-extras --locked

      - name: 端到端验证
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: uv run python scripts/verify_agent.py
